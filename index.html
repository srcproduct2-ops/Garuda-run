<style>
:root{--bg:#f2f4ef;--card:#ffffff;--text:#152015;--muted:#858f80;--lime:#d8f8ac;--lime-d:#8fdc52;--forest:#1d3a22;--soft:#f3f6ef;--border:#e7ebe2;--bad:#e5484d;--warn:#e6a00b;--ok:#3fa34d;--shadow:0 1px 3px rgba(20,40,20,.05),0 8px 24px rgba(20,40,20,.06);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c110c;--card:#151c15;--text:#eef5e8;--muted:#8a9a84;--lime:#22341b;--lime-d:#8fdc52;--forest:#8fdc52;--soft:#1b241b;--border:#243024;--shadow:0 10px 30px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c110c;--card:#151c15;--text:#eef5e8;--muted:#8a9a84;--lime:#22341b;--lime-d:#8fdc52;--forest:#8fdc52;--soft:#1b241b;--border:#243024;--shadow:0 10px 30px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 "Noto Sans Thai","Sarabun",system-ui,-apple-system,Tahoma,sans-serif;-webkit-font-smoothing:antialiased}
.topbar{position:sticky;top:0;z-index:5;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 10px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.brand{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand>div:nth-child(2){flex:1;min-width:0}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--lime);display:grid;place-items:center;color:var(--forest);flex:none}
.avatar svg,.icon-btn svg{width:22px;height:22px}
.brand small{display:block;font-size:.8rem;color:var(--muted);font-weight:600}
.topbar h1{margin:0;font-size:1.15rem;font-weight:800;letter-spacing:-.02em}
.icon-btn{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);color:var(--text);display:grid;place-items:center;box-shadow:var(--shadow);cursor:pointer;padding:0}
.view{max-width:760px;margin:0 auto;padding:8px 14px 130px;display:grid;gap:14px}
.card{background:var(--card);border-radius:24px;padding:18px;min-width:0;box-shadow:var(--shadow)}
.card h3{margin:0 0 12px;font-size:1rem;font-weight:800;letter-spacing:-.01em}
.card h4{margin:14px 0 8px;font-size:.72rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.muted{color:var(--muted);font-size:.87rem}
/* สรุปสัปดาห์ (การ์ดเขียวอ่อน) */
.summary{background:var(--lime);color:var(--forest)}
:root[data-theme="dark"] .summary{color:var(--text)}
.summary .muted{color:color-mix(in srgb,var(--forest) 70%,transparent)}
.sum-head{display:flex;align-items:center;justify-content:space-between;gap:14px}
.sum-head h2{margin:4px 0 2px;font-size:1.45rem;font-weight:900;letter-spacing:-.02em}
.summary .ring{width:104px;flex:none}
.summary .ring .rt{stroke:color-mix(in srgb,var(--forest) 14%,transparent)}
.summary .ring .rf{stroke:var(--forest)}
.summary .ring .rv b{font-size:1.1rem}
/* ปฏิทินสัปดาห์ */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dcell{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 12px;border-radius:16px;background:var(--soft);position:relative}
.dcell span{font-size:.7rem;font-weight:700;color:var(--muted)}
.dcell b{font-size:1rem;font-weight:800}
.dcell.today{background:var(--forest);color:#fff}
:root[data-theme="dark"] .dcell.today{color:#0c110c}
.dcell.today span{color:inherit;opacity:.8}
.dcell.done::after{content:"";position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--lime-d)}
.dcell.plan:not(.done)::after{content:"";position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;border:1.5px solid var(--lime-d)}
/* สถิติ 2x2 */
.stats2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.sic{width:40px;height:40px;border-radius:14px;background:var(--lime);color:var(--forest);display:grid;place-items:center;margin-bottom:4px}
.sic svg{width:20px;height:20px}
:root[data-theme="dark"] .sic{color:var(--lime-d)}
.stat b{font-size:1.25rem;font-weight:900;letter-spacing:-.02em}
.stat span{font-size:.78rem;font-weight:600;color:var(--muted)}
/* กราฟแท่งรายวัน */
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end}
.col{display:flex;flex-direction:column;align-items:center;gap:6px}
.stack{position:relative;width:100%;height:130px;border-radius:14px;background:var(--soft)}
.pbar,.abar{position:absolute;bottom:0;width:36%;border-radius:8px 8px 4px 4px;transition:height .8s cubic-bezier(.2,.8,.2,1)}
.pbar{left:12%;background:color-mix(in srgb,var(--muted) 22%,transparent)}
.abar{right:12%;background:var(--lime-d);min-height:0}
.col span{font-size:.72rem;font-weight:700;color:var(--muted)}
/* ฟอร์มและอื่น ๆ */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.field label{display:block;font-size:.76rem;font-weight:700;color:var(--muted);margin:0 0 6px}
input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid transparent;border-radius:16px;background:var(--soft);color:var(--text);font:inherit;transition:border-color .15s,box-shadow .15s,background .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--lime-d);background:var(--card);box-shadow:0 0 0 4px rgba(143,220,82,.25)}
input:disabled{opacity:.7}
textarea{min-height:48px;resize:vertical}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--soft);border-radius:18px;padding:14px 16px;min-width:0}
.kpi b{display:block;font-size:1.25rem;font-weight:900;margin-top:2px}
.kpi span{font-size:.74rem;font-weight:700;color:var(--muted)}
.bar{height:8px;background:var(--border);border-radius:99px;overflow:hidden;margin:10px 0 2px}
.bar>span{display:block;height:100%;border-radius:99px;background:var(--lime-d)}
.bar.over>span{background:var(--warn)}
.ring{position:relative;width:100%;max-width:120px;margin:0 auto;aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rt{fill:none;stroke:var(--border);stroke-width:10}
.ring .rf{fill:none;stroke:var(--lime-d);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.ring .rv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .rv b{font-size:1.1rem;font-weight:900;line-height:1.1}
.ring .rv span{font-size:.64rem;font-weight:700;color:var(--muted);max-width:80px;line-height:1.2;margin-top:2px}
button,.btn{font:inherit;font-weight:800;border:0;border-radius:16px;padding:12px 20px;background:var(--forest);color:#fff;cursor:pointer;display:inline-block;transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .2s,opacity .15s,background .2s}
:root[data-theme="dark"] button,:root[data-theme="dark"] .btn{color:#0c110c}
button:hover,.btn:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(20,40,20,.2)}
button:active,.btn:active{transform:translateY(0) scale(.97)}
button.ghost,.btn.ghost{background:var(--soft);color:var(--text)}
button.ghost:hover,.btn.ghost:hover{background:var(--border);box-shadow:none}
button.del{background:none;color:var(--bad);padding:6px 10px;font-weight:700}
button.del:hover{background:color-mix(in srgb,var(--bad) 12%,transparent);transform:none;box-shadow:none}
button.accent{background:var(--lime-d);color:#0c110c}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{display:inline-flex;gap:6px;align-items:center;border:1.5px solid var(--border);border-radius:99px;padding:8px 15px;font-size:.88rem;font-weight:700;cursor:pointer;transition:all .15s;background:var(--card)}
.chips label:hover{transform:translateY(-2px);border-color:var(--forest)}
.chips label:has(input:checked){background:var(--lime-d);color:#0c110c;border-color:var(--lime-d)}
.chips input{display:none}
.tag{display:inline-block;border-radius:99px;padding:4px 11px;font-size:.74rem;font-weight:800;white-space:nowrap}
.t-long{background:#e1ebff;color:#2a4fa0}.t-tempo{background:#ffe9c7;color:#8a4b00}.t-easy{background:#dff6e3;color:#1d6b3a}.t-rest{background:var(--soft);color:var(--muted)}.t-race{background:var(--lime-d);color:#0c110c}
.sess{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.sess b{font-size:1.2rem;font-weight:900}
.warnbox{background:var(--card);border:2px solid var(--lime-d);border-radius:20px;padding:16px 18px}
.warnbox ul{margin:6px 0 0;padding-left:18px}
.table-wrap{overflow-x:auto;border-radius:16px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.88rem}
th,td{padding:11px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}
th{color:var(--muted);font-weight:800;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;background:var(--soft)}
th:first-child{border-radius:14px 0 0 0}th:last-child{border-radius:0 14px 0 0}
tbody tr:last-child td{border-bottom:0}
.insight{border-left:5px solid var(--lime-d);background:var(--soft);border-radius:16px;padding:12px 16px;margin:8px 0}
.insight.warn{border-color:var(--warn)}.insight.bad{border-color:var(--bad)}
.insight b{display:block;font-size:.92rem;font-weight:800}.insight span{font-size:.85rem;color:var(--muted)}
.daylist{margin:0;padding:0}
.daylist li{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 14px;margin:0 -6px;border-radius:16px;cursor:pointer;transition:background .15s}
.daylist li:hover{background:var(--soft)}
.daylist li+li{border-top:1px solid var(--border)}
.daylist li>span:first-child{font-weight:800;min-width:58px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
/* เมนูด้านล่าง: แถบสีขาวโค้งลอย ไอคอนอยู่เหนือป้ายชื่อ แท็บที่เลือกมีพื้นสีอ่อนรองรับ (ตามวิดีโออ้างอิง) */
.tabs{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 28px));display:flex;align-items:center;gap:12px;z-index:6}
.pill{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:8px;border-radius:30px;background:rgba(255,255,255,.92);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);box-shadow:0 10px 30px rgba(20,30,20,.12)}
:root[data-theme="dark"] .pill{background:rgba(30,36,30,.92)}
.tabs button{background:none;color:var(--text);box-shadow:none;font-size:.7rem;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:9px 0 8px;border-radius:22px;transition:transform .2s cubic-bezier(.2,.8,.2,1),background .25s,color .25s;min-width:0}
.tabs button:hover{transform:translateY(-2px);box-shadow:none;background:var(--soft)}
.tabs button:active{transform:scale(.93)}
.tabs button .ic{display:grid;place-items:center;height:24px}
.tabs button .ic svg{width:24px;height:24px}
.tabs button .lb{line-height:1}
.tabs button.on{background:color-mix(in srgb,var(--lime-d) 32%,transparent);color:var(--forest);font-weight:800}
:root[data-theme="dark"] .tabs button.on{color:var(--lime-d)}
.tabs button.on .ic svg{animation:pop .35s cubic-bezier(.2,.8,.2,1)}
.tabs button:hover .ic svg{animation:wiggle .5s ease}
@keyframes pop{0%{transform:scale(.75)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
.tabs button.fab{flex:none;width:60px;height:60px;border-radius:50%;background:#fff;color:var(--text);padding:0;justify-content:center;box-shadow:0 10px 26px rgba(20,30,20,.16);font-size:0}
:root[data-theme="dark"] .tabs button.fab{background:var(--card);color:var(--text)}
.tabs button.fab .ic{height:auto;background:none!important}
.tabs button.fab .ic svg{width:26px;height:26px;stroke-width:2.2}
.tabs button.fab:hover{transform:translateY(-3px);background:#fff;box-shadow:0 14px 30px rgba(20,30,20,.2)}
.tabs button.fab.on{background:var(--lime-d);color:#0c110c}

.runcard{display:flex;align-items:center;justify-content:space-between;gap:12px;overflow:hidden}
.runtxt{min-width:0}
.runtxt h3{margin:4px 0 4px}
.runner{width:150px;flex:none}
.runner svg{width:100%;height:auto;display:block}
.runcard:hover .runner svg{animation:bob 1.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

.gate{text-align:center;padding:28px 22px}
.gate-ic{width:64px;height:64px;border-radius:50%;background:var(--lime-d);color:#0c110c;display:grid;place-items:center;margin:0 auto 14px}
.gate-ic svg{width:30px;height:30px}
.gate h3{justify-content:center;margin-bottom:8px}
.gate h3::before{display:none}
.gate p{margin:6px 0}
.req{color:var(--bad);font-weight:700;font-size:.72rem;margin-left:4px}

.tb-actions{display:flex;gap:8px;align-items:center}
.lang-btn{height:44px;border-radius:999px;border:0;background:var(--card);color:var(--muted);box-shadow:var(--shadow);padding:0 14px;font-weight:700;font-size:.8rem;display:flex;align-items:center;gap:4px;cursor:pointer}
.lang-btn span.cur{color:var(--forest);background:var(--lime-d);border-radius:999px;padding:3px 8px}
:root[data-theme="dark"] .lang-btn span.cur{color:#0c110c}
.lang-btn i{font-style:normal;opacity:.5}
.lang-btn:hover{transform:translateY(-2px)}
.lang-btn span{transition:background .2s}
svg text{font-family:inherit}
@media (min-width:700px){.view{padding-top:12px}}
/* ลูกเล่น */
.card{transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.card:hover{transform:translateY(-3px);box-shadow:0 1px 3px rgba(20,40,20,.05),0 18px 40px rgba(20,40,20,.1)}
.stat{transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.stat:hover{transform:translateY(-3px);box-shadow:0 18px 36px rgba(20,40,20,.1)}
.stat:hover .sic{transform:rotate(-8deg) scale(1.08)}
.sic{transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.dcell{transition:transform .2s,background .2s}
.dcell:hover{transform:translateY(-3px)}
.ring{transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.ring:hover{transform:scale(1.05)}
.kpi{transition:transform .2s,background .2s}
.kpi:hover{transform:translateY(-2px);background:color-mix(in srgb,var(--lime-d) 22%,var(--soft))}
.insight{transition:transform .2s}
.insight:hover{transform:translateX(4px)}
tbody tr{transition:background .15s}
tbody tr:hover td{background:color-mix(in srgb,var(--lime-d) 16%,transparent)}
.daylist li:hover{transform:translateX(4px)}
.daylist li{transition:background .15s,transform .2s}
.tabs button:hover .ic svg{animation:wiggle .5s ease}
@keyframes wiggle{0%,100%{transform:rotate(0)}30%{transform:rotate(-8deg)}65%{transform:rotate(6deg)}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.view>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.view>*:nth-child(2){animation-delay:.05s}.view>*:nth-child(3){animation-delay:.1s}.view>*:nth-child(4){animation-delay:.15s}.view>*:nth-child(5){animation-delay:.2s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- ชุดสีสันใหม่: ม่วงลาเวนเดอร์ + ไล่สีม่วงฟ้า + การ์ดพาสเทล ---------- */
:root{--bg:#eeeafb;--card:#ffffff;--text:#1d1640;--muted:#7a7399;--lime:#e7e1ff;--lime-d:#7c5cff;--forest:#5a3ce6;--soft:#f5f3ff;--border:#e6e1f7;--bad:#f2456b;--warn:#ff9f1c;--ok:#22b07d;--shadow:0 1px 2px rgba(60,40,140,.05),0 12px 30px rgba(90,60,230,.10);--grad:linear-gradient(135deg,#6c4cf0 0%,#3d9bff 100%);--t1:#e3efff;--t1i:#2f6fe4;--t2:#ece6ff;--t2i:#6c4cf0;--t3:#ffe6f0;--t3i:#e1467c;--t4:#fff0df;--t4i:#f08a2e;color-scheme:light}
body{background:radial-gradient(900px 500px at 90% -10%,rgba(124,92,255,.22),transparent 60%),radial-gradient(700px 400px at -10% 20%,rgba(61,155,255,.16),transparent 60%),var(--bg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#130f26;--card:#1d1837;--text:#f1eeff;--muted:#9a93be;--lime:#2b2350;--lime-d:#9b84ff;--forest:#9b84ff;--soft:#241e42;--border:#2e2752;--shadow:0 12px 30px rgba(0,0,0,.4);--t1:#1d2a4a;--t1i:#7fb0ff;--t2:#2a2350;--t2i:#b3a2ff;--t3:#3a1d2e;--t3i:#ff8fb6;--t4:#3a2a17;--t4i:#ffb86b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#130f26;--card:#1d1837;--text:#f1eeff;--muted:#9a93be;--lime:#2b2350;--lime-d:#9b84ff;--forest:#9b84ff;--soft:#241e42;--border:#2e2752;--shadow:0 12px 30px rgba(0,0,0,.4);--t1:#1d2a4a;--t1i:#7fb0ff;--t2:#2a2350;--t2i:#b3a2ff;--t3:#3a1d2e;--t3i:#ff8fb6;--t4:#3a2a17;--t4i:#ffb86b;color-scheme:dark}
button,.btn{background:var(--grad);color:#fff;box-shadow:0 10px 24px rgba(108,76,240,.28)}
button.ghost,.btn.ghost{background:var(--soft);color:var(--forest);box-shadow:none}
button.accent{background:var(--lime-d);color:#fff}
/* การ์ดสรุปไล่สี */
.summary{background:linear-gradient(135deg,#6c4cf0 0%,#3d9bff 100%);color:#fff;position:relative;overflow:hidden;box-shadow:0 18px 40px rgba(108,76,240,.35)}
.summary::after{content:"";position:absolute;right:-70px;bottom:-90px;width:230px;height:230px;border-radius:50%;background:rgba(255,255,255,.12)}
.summary .muted{color:rgba(255,255,255,.82)}
.summary .sum-head h2{color:#fff}
.summary .ring .rt{stroke:rgba(255,255,255,.25)}
.summary .ring .rf{stroke:#fff}
.summary .ring .rv b{color:#fff}
.summary .ring .rv span{color:rgba(255,255,255,.85)}
.summary>*{position:relative;z-index:1}
/* ปฏิทินและสถิติสีสัน */
.dcell{background:var(--soft)}
.dcell.today{background:linear-gradient(135deg,#6c4cf0,#3d9bff);color:#fff;box-shadow:0 8px 18px rgba(108,76,240,.3)}
:root[data-theme="dark"] .dcell.today{color:#fff}
.dcell.done::after{background:#22b07d}
.dcell.plan:not(.done)::after{border-color:var(--lime-d)}
.stats2 .stat:nth-child(1){background:var(--t1)}
.stats2 .stat:nth-child(2){background:var(--t2)}
.stats2 .stat:nth-child(3){background:var(--t3)}
.stats2 .stat:nth-child(4){background:var(--t4)}
.stats2 .stat:nth-child(1) .sic{background:#fff;color:var(--t1i)}
.stats2 .stat:nth-child(2) .sic{background:#fff;color:var(--t2i)}
.stats2 .stat:nth-child(3) .sic{background:#fff;color:var(--t3i)}
.stats2 .stat:nth-child(4) .sic{background:#fff;color:var(--t4i)}
:root[data-theme="dark"] .stats2 .stat .sic{background:rgba(255,255,255,.08)}
.stat b{color:var(--text)}
.kpi{background:var(--soft)}
.bar>span{background:var(--grad)}
.abar{background:var(--grad)}
.pbar{background:color-mix(in srgb,var(--lime-d) 18%,transparent)}
.insight{background:var(--soft);border-left-color:var(--lime-d)}
.warnbox{border-color:var(--warn);background:var(--card)}
.t-long{background:#e3efff;color:#2f6fe4}.t-tempo{background:#ffe6f0;color:#e1467c}.t-easy{background:#dff8ee;color:#16855e}.t-rest{background:var(--soft);color:var(--muted)}.t-race{background:var(--grad);color:#fff}
.chips label:has(input:checked){background:var(--grad);color:#fff;border-color:transparent}
/* ป้ายหัวตารางและแถว */
th{background:var(--soft)}
/* เมนูด้านล่างสีม่วง */
.pill{background:rgba(255,255,255,.96);box-shadow:0 12px 32px rgba(90,60,230,.18)}
:root[data-theme="dark"] .pill{background:rgba(29,24,55,.96)}
.tabs button{color:var(--muted)}
.tabs button.on{background:none;color:var(--text);font-weight:800}
.tabs button.on .ic{background:var(--grad);color:#fff;width:50px;height:34px;border-radius:999px;box-shadow:0 8px 18px rgba(108,76,240,.35)}
.tabs button.on .ic svg{color:#fff}
.tabs button.fab{background:var(--grad);color:#fff;box-shadow:0 12px 28px rgba(108,76,240,.42)}
:root[data-theme="dark"] .tabs button.fab{color:#fff}
.tabs button.fab.on{background:var(--grad)}
.avatar{background:var(--grad);color:#fff}
.lang-btn span.cur{background:var(--grad);color:#fff}
.logo{background:var(--grad);color:#fff}
.gate-ic{background:var(--grad);color:#fff}
.runner svg circle[fill="#d8f8ac"]{fill:#e7e1ff}
.runcard{background:linear-gradient(135deg,#f3efff,#e6f2ff)}
:root[data-theme="dark"] .runcard{background:var(--card)}
.table-wrap th:first-child{border-radius:12px 0 0 0}

/* ---------- แอนิเมชันแท็บแบบวิดีโอ: วงกลมสีสไลด์ไปตามไอคอน + ไอคอนเด้ง ---------- */
.pill{position:relative;--w:calc((100% - 32px)/5)}
.ind{position:absolute;top:16px;left:calc(8px + var(--i,0) * (var(--w) + 4px) + (var(--w) - 50px) / 2);width:50px;height:34px;border-radius:999px;background:var(--grad);box-shadow:0 8px 20px rgba(60,40,140,.28);transition:left .6s cubic-bezier(.34,1.45,.64,1),background .45s ease,opacity .3s;pointer-events:none;z-index:0}
.tabs button{position:relative;z-index:1}
.tabs button .ic{width:50px;height:34px;background:none!important;box-shadow:none!important;transition:color .35s ease,transform .35s cubic-bezier(.34,1.56,.64,1)}
.tabs button:not(.on) .ic{color:var(--muted)}
.tabs button.on{background:none}
.tabs button.on .ic{color:#fff;transform:translateY(-1px) scale(1.06)}
.tabs button.on .ic svg{animation:tabPop .5s cubic-bezier(.34,1.56,.64,1)}
.tabs button:not(.on) .lb{opacity:.75;transition:opacity .3s}
.tabs button.on .lb{opacity:1;color:var(--text);font-weight:800;transition:opacity .3s}
.tabs button:hover .ic svg{animation:wiggle .5s ease}
.tabs button:active{transform:scale(.9)}
.tabs button.fab .ic{width:auto;height:auto}
.tabs button.fab .ic svg{width:26px;height:26px}
@keyframes tabPop{0%{transform:scale(.6) rotate(-12deg)}60%{transform:scale(1.18) rotate(4deg)}100%{transform:scale(1) rotate(0)}}

/* ---------- แถบเมนูล็อกอยู่กับที่ ไม่เลื่อนตามการเลื่อนหน้า ---------- */
.tabs{position:fixed!important;left:50%!important;bottom:calc(env(safe-area-inset-bottom,0px) + 14px)!important;top:auto!important;right:auto!important;transform:translate3d(-50%,0,0)!important;-webkit-transform:translate3d(-50%,0,0);will-change:transform;backface-visibility:hidden;isolation:isolate;contain:layout style}
.pill{will-change:auto}
html,body{overscroll-behavior-y:contain}
.view{padding-bottom:140px}

/* ---------- พื้นหลังสีขาว (โหมดสว่าง) ---------- */
:root:not([data-theme="dark"]){--bg:#ffffff;--soft:#f5f6fa;--border:#ebedf3;--shadow:0 1px 2px rgba(20,20,40,.04),0 8px 24px rgba(20,20,40,.07)}
body{background:#ffffff!important}
.card{border:1px solid var(--border)}
.topbar{background:rgba(255,255,255,.92)!important}
.view{background:transparent}

/* ---------- Splash screen: โลโก้ StrivUp ---------- */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#ffffff;transition:opacity .6s ease,visibility .6s;cursor:pointer}
#splash.out{opacity:0;visibility:hidden}
.sp-mark{width:150px;height:105px;animation:spIn .9s cubic-bezier(.2,.9,.25,1.2) both}
.sp-svg{width:100%;height:100%;object-fit:contain;border-radius:22%;overflow:visible;animation:spFloat 2.4s ease-in-out .9s infinite}
.sp-word{font-size:2.1rem;font-weight:900;letter-spacing:-.03em;line-height:1;animation:spUp .7s .35s cubic-bezier(.2,.8,.2,1) both;white-space:nowrap}
.sp-g{background:linear-gradient(135deg,#6c4cf0,#3d9bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sp-r{color:var(--text)}
.sp-tag{margin:2px 0 0;font-size:.85rem;color:var(--muted);font-weight:600;animation:spUp .7s .55s cubic-bezier(.2,.8,.2,1) both}
.sp-bar{width:120px;height:4px;border-radius:99px;background:var(--border);overflow:hidden;margin-top:22px;animation:spUp .6s .7s both}
.sp-bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#6c4cf0,#3d9bff);animation:spLoad 1.8s .8s cubic-bezier(.4,0,.2,1) forwards}
@keyframes spIn{from{opacity:0;transform:translateY(16px) scale(.6)}to{opacity:1;transform:none}}
@keyframes spUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes spFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes spLoad{to{width:100%}}
@media (prefers-reduced-motion:reduce){#splash *{animation:none!important}}
#splash{background:#000 !important;justify-content:center;gap:0}
.sp-full{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;animation:spFade .8s ease both}
#splash .sp-bar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 9%);margin:0;background:rgba(255,255,255,.18)}
#splash .sp-bar i{background:linear-gradient(90deg,#8fdc52,#d8f8ac)}
@keyframes spFade{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}


/* ---------- หน้าเข้าสู่ระบบ ---------- */
[hidden]{display:none!important}
body.guest .topbar,body.guest .tabs,body.guest #view{display:none!important}
#auth{position:fixed;inset:0;z-index:50;align-items:center;justify-content:center;padding:20px;background:#ffffff;overflow-y:auto}
#auth[hidden]{display:none!important}
.au-card{width:min(400px,100%);background:#f5f6fa;border-radius:30px;padding:26px 22px 22px;box-shadow:0 20px 50px rgba(60,40,140,.12);position:relative}
.au-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.au-brand{font-weight:800;color:var(--muted);font-size:.9rem}
.au-card h2{margin:14px 0 14px;font-size:1.9rem;font-weight:900;letter-spacing:-.03em}
.au-link{background:none;border:0;color:var(--forest);font:inherit;font-weight:700;font-size:.82rem;padding:6px 8px;cursor:pointer;box-shadow:none}
.au-link:hover{transform:none;box-shadow:none;opacity:.8}
.au-err{min-height:20px;color:var(--bad);font-size:.84rem;font-weight:600;margin:0 4px 6px}
#dlg{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:20px;background:rgba(20,16,40,.45)}
.dlg-box{width:min(380px,100%);background:#fff;border-radius:24px;padding:22px;box-shadow:0 24px 60px rgba(20,16,40,.3)}
.dlg-box h3{margin:0 0 8px;font-size:1.1rem}
.dlg-box p{margin:0}
.dlg-actions{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.dlg-actions button{width:100%}
.au-err.ok{color:#1f7a4d}
.au-hint{margin:0 4px 8px;font-size:.84rem;color:var(--muted);line-height:1.45}
.au-in{display:flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:6px 6px 6px 8px;margin:10px 0;box-shadow:0 2px 8px rgba(20,20,40,.04);border:1.5px solid transparent;transition:border-color .2s,box-shadow .2s}
.au-in:focus-within{border-color:#6c4cf0;box-shadow:0 0 0 4px rgba(108,76,240,.14)}
.au-ic{width:38px;height:38px;border-radius:50%;background:var(--soft);color:var(--muted);display:grid;place-items:center;flex:none}
.au-ic svg{width:18px;height:18px}
.au-in input{border:0;background:transparent;padding:10px 4px;box-shadow:none!important;flex:1;min-width:0}
.au-in input:focus{background:transparent}
.au-in .au-link{flex:none;padding:6px 12px;border-radius:999px;background:var(--soft)}
.au-actions{display:flex;justify-content:flex-end;margin-top:16px}
.au-go{width:60px;height:60px;border-radius:50%;padding:0;display:grid;place-items:center;background:#1d1640;color:#fff;box-shadow:0 12px 26px rgba(29,22,64,.3)}
.au-go svg{width:24px;height:24px}
.au-go:hover{transform:translateX(3px);box-shadow:0 14px 30px rgba(29,22,64,.35)}
.au-or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.8rem;margin:20px 0 14px}
.au-or::before,.au-or::after{content:"";flex:1;height:1px;background:var(--border)}
.au-google{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1d1640;border:1.5px solid var(--border);border-radius:999px;padding:13px 16px;box-shadow:0 2px 8px rgba(20,20,40,.05)}
.au-google svg{width:20px;height:20px}
.au-google:hover{background:#fff;box-shadow:0 8px 20px rgba(20,20,40,.1)}
.au-guest{width:100%;margin-top:10px;background:transparent;color:var(--muted);border:1.5px dashed var(--border);border-radius:999px;padding:12px 16px;font-weight:700;box-shadow:none}
.au-guest:hover{background:#fff;transform:none;box-shadow:none}
.au-note{margin:18px 4px 0;font-size:.74rem;color:var(--muted);text-align:center}
.whocard{display:flex;align-items:center;gap:14px}
.whoav{width:52px;height:52px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:900;font-size:1.2rem;flex:none}
.whocard b{font-size:1.05rem}
.whocard button{flex:none}

/* ---------- แท็บวิ่งจับเส้นทาง ---------- */
.trk-map{height:min(52vh,420px);min-height:280px;border-radius:20px;overflow:hidden;background:var(--soft);position:relative;z-index:0}
.trk-map .leaflet-container{width:100%;height:100%;font:inherit;background:var(--soft)}
:root[data-theme="dark"] .trk-map .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.92)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .trk-map .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.92)}}
.trk-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.trk-stats div{background:var(--soft);border-radius:16px;padding:10px 6px;text-align:center;min-width:0}
.trk-stats b{display:block;font-size:1.35rem;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.trk-stats span{font-size:.72rem;font-weight:700;color:var(--muted)}
.trk-ctrl{display:flex;gap:10px;margin-top:12px}
.trk-ctrl button{flex:1;padding:15px 10px;font-size:1rem}
.trk-ctrl button.stop{background:var(--bad);box-shadow:none}
.trk-msg{margin:10px 2px 0;font-size:.82rem;color:var(--muted);min-height:1.2em}
.trk-msg.err{color:var(--bad);font-weight:700}
.trk-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-right:6px;animation:trkblink 1.2s infinite}
@keyframes trkblink{50%{opacity:.25}}
.tabs button.rec .ic::after{content:"";position:absolute;top:2px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid var(--card);animation:trkblink 1.2s infinite}
.me-dot{width:16px;height:16px;border-radius:50%;background:#3d9bff;border:3px solid #fff;box-shadow:0 0 0 6px rgba(61,155,255,.25)}
.pt-flag{width:14px;height:14px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.runlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.runlist li{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:16px;padding:10px 12px}
.runlist li .info{flex:1;min-width:0;cursor:pointer}
.runlist li b{display:block;font-size:.95rem}
.runlist li.sel{outline:2px solid var(--lime-d)}
.off-bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:10px}
.off-bar i{display:block;height:100%;width:0;background:var(--lime-d);border-radius:99px;transition:width .2s}
.off-bar[hidden]{display:none}
.tabs .pill button .ic,.tabs .pill button.on .ic{width:42px}
.pill .ind{width:42px;left:calc(8px + var(--i,0) * (var(--w) + 4px) + (var(--w) - 42px) / 2)}

/* ประวัติการวิ่ง + แท็บ 6 ช่อง */
.pill{grid-template-columns:repeat(6,1fr);gap:2px;padding:8px 6px;--w:calc((100% - 22px)/6)}
.tabs .pill button .ic,.tabs .pill button.on .ic{width:36px}
.pill .ind{width:36px;left:calc(6px + var(--i,0) * (var(--w) + 2px) + (var(--w) - 36px) / 2)}
.tabs button{font-size:.64rem}
.his-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.his-sum b{display:block;font-size:1.25rem;font-weight:900;letter-spacing:-.02em}
.his-sum span{font-size:.75rem;color:var(--muted);font-weight:600}
.his-mon{margin:6px 4px 0;font-size:.78rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.his-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.his-row{display:flex;align-items:center;gap:14px;padding:12px 14px;background:var(--card);border-radius:20px;box-shadow:var(--shadow);cursor:pointer}
.his-row:active{transform:scale(.985)}
.his-d{flex:none;width:50px;height:54px;border-radius:16px;background:var(--lime);color:var(--forest);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
:root[data-theme="dark"] .his-d{color:var(--text)}
.his-d b{font-size:1.2rem;font-weight:900}.his-d span{font-size:.68rem;font-weight:700;opacity:.8}
.his-m{flex:1;min-width:0}.his-m b{font-size:1.1rem;font-weight:800}.his-m b small{font-size:.8rem;font-weight:700;color:var(--muted)}
.his-m .muted{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.his-r{flex:none;display:flex;align-items:center;gap:6px;color:var(--muted)}.his-r svg{width:18px;height:18px}
.his-map{height:240px;border-radius:20px;overflow:hidden;background:var(--soft)}
.his-back{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;font-size:.9rem}
.his-big{font-size:2.6rem;font-weight:900;letter-spacing:-.03em;line-height:1.1}.his-big small{font-size:1rem;font-weight:700;color:var(--muted);margin-left:4px}
.his-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.his-st{padding:14px 0;border-top:1px solid var(--border)}.his-st b{display:block;font-size:1.35rem;font-weight:800}.his-st span{font-size:.82rem;color:var(--muted)}
.his-note{white-space:pre-wrap;margin:6px 0 0}
</style>
</head>
<body class="guest">
<script>
  // ตัวช่วยวินิจฉัย: ถ้าสคริปต์มีข้อผิดพลาด จะแสดงข้อความบนหน้าจอ
  window.addEventListener("error", e => {
    const box = document.createElement("pre");
    box.style.cssText = "position:fixed;left:8px;right:8px;top:8px;z-index:999;background:#fff3f3;color:#b00020;padding:10px;border-radius:10px;font-size:12px;white-space:pre-wrap;box-shadow:0 4px 16px rgba(0,0,0,.2)";
    box.textContent = "ข้อผิดพลาด: " + e.message + " (บรรทัด " + e.lineno + ")";
    document.body.appendChild(box);
  });
  window.addEventListener("unhandledrejection", e => {
    const box = document.createElement("pre");
    box.style.cssText = "position:fixed;left:8px;right:8px;bottom:120px;z-index:999;background:#fff3f3;color:#b00020;padding:10px;border-radius:10px;font-size:12px;white-space:pre-wrap";
    box.textContent = "ข้อผิดพลาด (async): " + (e.reason && e.reason.message ? e.reason.message : e.reason);
    document.body.appendChild(box);
  });
</script>

<script>
const KEY = "runplanner-app-v4";
const DAY_NAMES = ["จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์","อาทิตย์"];
const DAY_MS = 864e5;
const DAY_IDX = [0, 1, 2, 3, 4, 5, 6];
const DAY_EN = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const DAY_EN_S = ["Mo","Tu","We","Th","Fr","Sa","Su"];
// ระยะแข่งและค่าพื้นฐานของแผน (key "0" = ฐานสุขภาพ ไม่มีวันแข่ง)
const RACES = {
  0:  { name: "ฐานสุขภาพ (ไม่มีวันแข่ง)", km: 0, peak: 25, longPeak: 10, minWeeks: 4, racePad: 0 },
  5:  { name: "5K", km: 5, peak: 25, longPeak: 8, minWeeks: 6, recWeeks: 8, racePad: 0 },
  10: { name: "10K", km: 10, peak: 35, longPeak: 14, minWeeks: 8, recWeeks: 10, racePad: 0.1 },
  21: { name: "ฮาล์ฟมาราธอน 21.1K", km: 21.1, peak: 50, longPeak: 19, minWeeks: 10, recWeeks: 14, racePad: 0.3 },
  42: { name: "ฟูลมาราธอน 42.195K", km: 42.195, peak: 70, longPeak: 32, minWeeks: 16, recWeeks: 20, racePad: 0.6 }
};
const DEFAULT_PROFILE = { goal: "finish", age: "", weight: "", years: "", longest: "", curPace: "", days: [1,3,6], minutes: 45, injuries: [], injNote: "", maxHr: "", restHr: "", cv: "", vo2: "" };
const TAG = { long: "t-long", tempo: "t-tempo", easy: "t-easy", rest: "t-rest", race: "t-race" };
const TITLES = { today: "วันนี้", track: "วิ่งจับเส้นทาง", history: "ประวัติการวิ่ง", log: "บันทึกประจำวัน", plan: "แผนซ้อม", summary: "สรุปรายสัปดาห์", profile: "โปรไฟล์นักวิ่ง" };

const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const mondayOf = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const thisMon = () => mondayOf(new Date());
const r1 = n => Math.round(n * 10) / 10;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtPace = p => {
  if (!isFinite(p) || p <= 0) return "–";
  let m = Math.floor(p), s = Math.round((p - m) * 60);
  if (s === 60) { m++; s = 0; }
  return `${m}:${pad(s)}`;
};
const parsePace = s => {
  s = String(s || "").trim();
  if (s.includes(":")) { const [m, sec] = s.split(":").map(Number); return (m || 0) + (sec || 0) / 60; }
  return Number(s) || 0;
};
const thaiDate = d => d.toLocaleDateString(state.lang === "en" ? "en-US" : "th-TH", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
const shortDate = d => `${pad(d.getDate())}/${pad(d.getMonth() + 1)}`;

// ---------- state ----------
let state = { profile: { ...DEFAULT_PROFILE }, days: {}, plan: null, tab: "today", lang: "th", ui: { wk: null, logDate: null } };
try {
  const s = JSON.parse(localStorage.getItem(KEY));
  if (s) state = { ...state, profile: { ...DEFAULT_PROFILE, ...s.profile }, days: s.days || {}, plan: s.plan || null, lang: s.lang || "th", user: s.user || null, routes: s.routes || [] };
  // บัญชีแบบอีเมล (ระบบเก่า) ไม่ให้ข้ามหน้า login แล้ว ต้องเข้าด้วย Google ผ่าน Firebase
  if (state.user && state.user.provider === "local") state.user = null;
} catch (e) {}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify({ profile: state.profile, days: state.days, plan: state.plan, lang: state.lang, user: state.user, routes: state.routes || [] })); } catch (e) {}
  if (window.cloudSave && state.user && state.user.uid) window.cloudSave(state).catch(() => {});
}
const P = () => state.profile;
// ต้องบันทึกโปรไฟล์ (พร้อมอายุ) ก่อนจึงสร้างแผนได้
const profileMissing = () => { const m = []; if (!(Number(P().age) > 0)) m.push("อายุ"); if (!P().saved) m.push("กดบันทึกข้อมูลนักวิ่งในแท็บโปรไฟล์"); return m; };
const profileReady = () => profileMissing().length === 0;
const plan = () => state.plan;

// ---------- โปรไฟล์ -> ค่าที่คำนวณ ----------
function maxHR() { const p = P(); return Number(p.maxHr) || (Number(p.age) ? Math.round(208 - 0.7 * Number(p.age)) : 0); }
function zoneBpm(z) {
  const mx = maxHR(), rs = Number(P().restHr) || 0;
  if (!mx) return "";
  const pct = { 1: [.5, .6], 2: [.6, .7], 3: [.7, .8], 4: [.8, .9], 5: [.9, 1] };
  const parts = z.replace("Z", "").split("-").map(Number);
  const b = x => Math.round(rs + x * (mx - rs));
  return `${b(pct[parts[0]][0])}–${b(pct[parts[parts.length - 1]][1])} bpm`;
}
function paces() {
  const p = P(), goalPace = 6.0;
  let tp, src;
  const cv = Number(p.cv), vo2 = Number(p.vo2);
  if (cv > 0) { tp = 1000 / cv / 60; src = "จาก Critical Velocity"; }
  else if (vo2 > 0) { tp = 1000 / ((vo2 / 0.2) * 0.8); src = "ประมาณจาก VO2 Max (โดยประมาณ)"; }
  else { tp = goalPace; src = "ค่าเริ่มต้น (ยังไม่มี CV หรือ VO2 Max)"; }
  return { tp, src, easy: tp + 1.0, long: tp + 1.2, tempo: tp, interval: tp - 0.4 };
}
const profDays = () => { const d = [...P().days].sort((a, b) => a - b); return d.length ? d.slice(0, 6) : [1, 3, 6]; };
const injured = () => P().injuries.length > 0;
const healthGoal = () => P().goal === "weight" || P().goal === "health";
const profSig = () => JSON.stringify([profDays(), P().minutes, P().injuries, P().goal, P().cv, P().vo2, P().maxHr, P().restHr, P().age]);

// ---------- ข้อมูลรายวันและสถิติ ----------
function rangeStats(a, b) {
  const s = iso(a), e = iso(b);
  let km = 0, min = 0, runs = 0, kcal = 0, hrSum = 0, hrMin = 0, sleepSum = 0, sleepN = 0, rpeSum = 0, rpeN = 0;
  Object.keys(state.days).forEach(d => {
    if (d < s || d >= e) return;
    const r = state.days[d];
    if (r.sleep) { sleepSum += r.sleep; sleepN++; }
    if (r.km) {
      runs++; km += r.km; min += r.min; kcal += r.kcal || 0;
      if (r.hr) { hrSum += r.hr * r.min; hrMin += r.min; }
      if (r.rpe) { rpeSum += r.rpe; rpeN++; }
    }
  });
  return { km, min, runs, kcal, hr: hrMin ? Math.round(hrSum / hrMin) : 0, sleep: sleepN ? sleepSum / sleepN : 0, sleepN, rpe: rpeN ? rpeSum / rpeN : 0, pace: km ? min / km : 0 };
}

// ---------- แผน: สร้าง / ดึงข้อมูลตามสัปดาห์ ----------
const weekStartOf = i => addDays(plan() ? parseISO(plan().startMonday) : thisMon(), (i - 1) * 7);
const weekIndexOf = mon => plan() ? Math.round((mon - parseISO(plan().startMonday)) / (7 * DAY_MS)) + 1 : 0;
const planWeekIdx = () => plan() ? weekIndexOf(thisMon()) : 0;
const weekAt = i => (plan() && i >= 1 && i <= plan().W) ? plan().weeks[i - 1] : null;
const currentWeek = () => weekAt(planWeekIdx());
const weekActual = i => { const m = weekStartOf(i); return rangeStats(m, addDays(m, 7)); };

function sessions(km, long, days, q, pc) {
  const n = days.length, longDay = days[n - 1], qDay = q && n >= 3 ? days[1] : -1;
  const easy = n > 1 ? r1((km - long) / (n - 1)) : 0;
  return DAY_IDX.map((_, d) => {
    const day = dn(d);
    const e = { day, type: "rest", label: "พัก / Cross training", km: 0, pace: "", hr: "" };
    if (!days.includes(d)) return e;
    if (d === longDay) return { ...e, type: "long", label: "วิ่งยาว", km: r1(n === 1 ? km : long), pace: fmtPace(pc.long), hr: "Z2" };
    if (d === qDay) {
      const iv = q === "interval";
      return { ...e, type: "tempo", label: iv ? "อินเทอร์วัล" : "วิ่งเร็ว (Tempo)", km: easy, pace: fmtPace(iv ? pc.interval : pc.tempo), hr: iv ? "Z4-5" : "Z3-4" };
    }
    return { ...e, type: "easy", label: "วิ่งเบา", km: easy, pace: fmtPace(pc.easy), hr: "Z2" };
  });
}
// รายการวันในสัปดาห์ของแผน (ใช้ค่า snapshot ในแผน ไม่ใช้โปรไฟล์ปัจจุบัน)
function sessionsOf(wk) {
  const p = plan();
  if (!wk.race) return sessions(wk.km, wk.long || wk.km, p.days, wk.q, p.paces);
  const list = sessions(wk.km, wk.km * 0.5, p.days.slice(0, 2), "", p.paces);
  list[p.raceIdx] = { day: dn(p.raceIdx), type: "race", label: `🏁 วันแข่ง ${RACES[p.setup.distance].name}`, km: RACES[p.setup.distance].km, pace: fmtPace(p.racePace), hr: "" };
  return list;
}

function makePlan(setup, startMon, raceIdx) {
  const pc = paces(), days = profDays(), inj = injured(), hg = healthGoal();
  const R = RACES[setup.distance], isBase = setup.distance === "0", W = setup.W;
  const last4 = rangeStats(addDays(startMon, -28), startMon).km / 4;
  const start = Math.max(5, last4 || (Number(P().longest) ? Number(P().longest) * 2 : 10));
  const peakKm = R.peak * (inj ? 0.85 : 1) * (hg ? 0.8 : 1);
  const rate = inj ? 0.05 : 0.10;
  const longCap = Math.min(R.longPeak, (P().minutes * 1.6) / pc.long);
  let cur = start, longCur = Math.min(Number(P().longest) || start * 0.35, longCap);
  const build = Math.max(1, W - (isBase ? 0 : 2)), weeks = [];
  for (let w = 1; w <= W; w++) {
    const raceW = !isBase && w === W, taperW = !isBase && w === W - 1;
    let phase, km, long, q = "", cut = false;
    if (raceW) { phase = "สัปดาห์แข่ง"; km = cur * 0.35; long = 0; }
    else if (taperW) { phase = "ลดโหลด (Taper)"; km = cur * 0.6; long = longCur * 0.5; }
    else {
      const p = w / build;
      cut = w % (inj ? 3 : 4) === 0 && w < build;
      if (!cut) { cur = Math.min(cur * (1 + rate), peakKm); longCur = Math.min(longCur * (1 + rate), longCap); }
      km = cut ? cur * 0.8 : cur; long = cut ? longCur * 0.8 : longCur;
      phase = p < 0.35 ? "สร้างฐาน" : p < 0.8 ? "พัฒนาความอดทน" : "พีค";
      if (w >= 2 && !inj && !hg && !cut) q = phase === "พีค" ? "interval" : "tempo";
    }
    weeks.push({ w, phase, km: r1(km), long: r1(Math.min(long, km)), q, cut, race: raceW });
  }
  return {
    startMonday: iso(startMon), W, setup, raceIdx, days, paces: pc, racePace: pc.tempo + R.racePad,
    startKm: r1(start), peak: r1(peakKm), rate, longCap: r1(longCap), weeks, sig: profSig(), createdAt: Date.now()
  };
}
// สร้างแผนจากค่าที่ตั้ง; ถ้ามีวันแข่ง ระบบคำนวณจำนวนสัปดาห์และวันแข่งให้
function buildFromSetup(setup, startMon) {
  let W = setup.weeks, raceIdx = 6;
  if (setup.raceDate && setup.distance !== "0") {
    const diff = Math.round((parseISO(setup.raceDate) - startMon) / DAY_MS);
    if (diff < 0) return { error: "วันแข่งอยู่ก่อนวันเริ่มแผน" };
    W = Math.floor(diff / 7) + 1; raceIdx = diff % 7;
  }
  if (!(W >= 4 && W <= 30)) return { error: "ระยะเวลาซ้อมต้องอยู่ระหว่าง 4-30 สัปดาห์ (หรือวันแข่งต้องอยู่ห่างอย่างน้อย 4 สัปดาห์)" };
  return { plan: makePlan({ ...setup, W }, startMon, raceIdx) };
}

// ---------- ตรวจว่าควรสร้างแผนใหม่หรือไม่ (แนะนำเท่านั้น ไม่เปลี่ยนแผนเอง) ----------
function replanReasons() {
  const r = [];
  if (!plan()) return r;
  if (plan().sig !== profSig()) r.push("ข้อมูลนักวิ่งในโปรไฟล์เปลี่ยนไปจากตอนสร้างแผน");
  const idx = planWeekIdx();
  if (idx >= 2 && idx - 1 <= plan().W) {
    const prev = weekAt(idx - 1), act = weekActual(idx - 1);
    if (prev && prev.km > 0 && act.n !== undefined) {
      const c = act.km / prev.km;
      if (c < 0.7) r.push(`สัปดาห์ที่แล้วทำได้ ${Math.round(c * 100)}% ของแผน`);
      if (c > 1.2) r.push("สัปดาห์ที่แล้วเกินแผนมาก ระวังความเหนื่อยสะสม");
    }
    if (act.rpe >= 8) r.push(`ความเหนื่อยเฉลี่ยสัปดาห์ที่แล้ว ${r1(act.rpe)}/10`);
  }
  const t = new Date(), last7 = rangeStats(addDays(t, -6), addDays(t, 1));
  if (last7.sleepN && last7.sleep < 6) r.push(`นอนเฉลี่ย 7 วันล่าสุด ${r1(last7.sleep)} ชม. (ต่ำกว่า 6 ชม.)`);
  return r;
}

// ---------- มุมมอง ----------
function sessionCard(s) {
  const zone = s.hr ? (zoneBpm(s.hr) ? `${s.hr} · ${zoneBpm(s.hr)}` : s.hr) : "";
  return `<div class="sess"><span class="tag ${TAG[s.type]}">${s.label}</span><b>${s.km ? r1(s.km) + " km" : "พัก"}</b>${s.pace ? `<span class="muted">${s.pace} /km</span>` : ""}${zone ? `<span class="muted">โซนหัวใจ ${zone}</span>` : ""}</div>`;
}
function replanBanner() {
  const reasons = replanReasons();
  if (!reasons.length) return "";
  return `<div class="warnbox"><b>แนะนำให้สร้างแผนใหม่</b><ul>${reasons.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    <div class="actions"><button data-act="replan">สร้างแผนใหม่จากข้อมูลล่าสุด</button><span class="muted">หรือทำตามแผนเดิมต่อไปได้</span></div></div>`;
}
function ring(pct, val, lab) {
  const r = 46, c = 2 * Math.PI * r, o = c * (1 - Math.min(Math.max(pct, 0), 100) / 100);
  return `<div class="ring"><svg viewBox="0 0 110 110"><circle cx="55" cy="55" r="${r}" class="rt"/><circle cx="55" cy="55" r="${r}" class="rf" stroke-dasharray="${c}" stroke-dashoffset="${o}"/></svg><div class="rv"><b>${val}</b><span>${lab}</span></div></div>`;
}
function weekRings(wk, act) {
  const planned = wk ? sessionsOf(wk).filter(s => s.km > 0).length : 0;
  const pk = wk && wk.km ? act.km / wk.km * 100 : 0;
  const pr = planned ? act.runs / planned * 100 : 0;
  return `<div class="rings">${ring(pk, r1(act.km) + "", `km จากแผน ${wk ? r1(wk.km) : "–"}`)}${ring(pr, act.runs, `จาก ${planned} ครั้ง`)}${ring(act.sleepN ? act.sleep / 8 * 100 : 0, act.sleepN ? r1(act.sleep) : "–", "ชม. นอนเฉลี่ย")}</div>`;
}
function progressRows(wk, act) {
  const plannedRuns = wk ? sessionsOf(wk).filter(s => s.km > 0).length : 0;
  const pct = wk && wk.km ? Math.min(100, act.km / wk.km * 100) : 0;
  return `
    <div class="kpis">
      <div class="kpi"><span>ระยะ (จริง / แผน)</span><b>${r1(act.km)} / ${wk ? r1(wk.km) : "–"} km</b><div class="bar ${wk && act.km > wk.km * 1.1 ? "over" : ""}"><span style="width:${pct}%"></span></div></div>
      <div class="kpi"><span>จำนวนครั้งที่วิ่ง</span><b>${act.runs} / ${plannedRuns || "–"}</b></div>
      <div class="kpi"><span>HR เฉลี่ย</span><b>${act.hr ? act.hr + " bpm" : "–"}</b></div>
      <div class="kpi"><span>เพซเฉลี่ย</span><b>${fmtPace(act.pace)} /km</b></div>
      <div class="kpi"><span>แคลอรี่รวม</span><b>${act.kcal ? Math.round(act.kcal) + " kcal" : "–"}</b></div>
      <div class="kpi"><span>นอนเฉลี่ย</span><b>${act.sleepN ? r1(act.sleep) + " ชม." : "–"}</b></div>
    </div>`;
}

const IC = {

function translate(s) {
  if (state.lang !== "en") return s;

  for (const k of EN_KEYS) if (out.includes(k)) out = out.split(k).join(EN[k]);

}

// แปลข้อความทุก text node ใน DOM (เก็บต้นฉบับไทยไว้เพื่อสลับกลับได้)
function applyLang(root) {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: n => (n.parentNode && /^(SCRIPT|STYLE)$/.test(n.parentNode.nodeName)) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT
  });
  const nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n => {
    if (n.__th === undefined) n.__th = n.nodeValue;
    const src = n.__th;
    if (src.trim()) n.nodeValue = state.lang === "en" ? translate(src) : src;
  });
  root.querySelectorAll("[placeholder]").forEach(el => {
    if (el.__thp === undefined) el.__thp = el.getAttribute("placeholder");
    el.setAttribute("placeholder", state.lang === "en" ? translate(el.__thp) : el.__thp);
  });
  document.documentElement.lang = state.lang;
}

const HIS = { sel: null, map: null };
function hisEntries() {
  const days = state.days || {}, routes = state.routes || [], out = [];
  Object.keys(days).forEach(d => {
    const r = days[d];
    if (r && Number(r.km) > 0) out.push({ date: d, km: Number(r.km), min: Number(r.min) || 0, hr: Number(r.hr) || 0, kcal: Number(r.kcal) || 0, rpe: Number(r.rpe) || 0, note: r.note || "", sleep: Number(r.sleep) || 0, routes: routes.filter(x => x.date === d) });
  });
  routes.forEach(rt => {
    if (!out.find(e => e.date === rt.date)) out.push({ date: rt.date, km: Number(rt.km) || 0, min: Number(rt.min) || 0, hr: 0, kcal: 0, rpe: 0, note: "", sleep: 0, routes: routes.filter(x => x.date === rt.date) });
  });
  return out.sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
}
const hisLoc = () => state.lang === "en" ? "en-GB" : "th-TH";
function hisKcal(e) {
  if (e.kcal) return { v: Math.round(e.kcal), est: false };

  return w > 0 && e.km ? { v: Math.round(w * e.km * 1.036), est: true } : null;
}

}

VIEWS.today = () => {
  const t = new Date(), wk = currentWeek(), idx = planWeekIdx(), tIdx = (t.getDay() + 6) % 7;
  const mon = thisMon(), act = wk ? weekActual(idx) : rangeStats(mon, addDays(mon, 7)), list = wk ? sessionsOf(wk) : null;
  const todaySess = list ? list[tIdx] : null, rec = state.days[iso(t)] || {};
  const pct = wk && wk.km ? Math.min(100, act.km / wk.km * 100) : 0;
  const status = !plan() ? "ยังไม่มีแผนซ้อม" : wk ? `สัปดาห์ที่ ${wk.w} จาก ${plan().W}` : idx > plan().W ? "จบแผนแล้ว" : "ยังไม่ถึงช่วงแผน";
  const strip = Array.from({ length: 7 }, (_, i) => {
    const d = addDays(mon, i), k = iso(d), x = state.days[k] || {};
    const cls = ["dcell", k === iso(t) ? "today" : "", x.km > 0 ? "done" : "", !(x.km > 0) && list && list[i].km > 0 ? "plan" : ""].join(" ");
    return `<div class="${cls}"><span>${dns(i)}</span><b>${d.getDate()}</b></div>`;
  }).join("");
  const dayKm = i => (state.days[iso(addDays(mon, i))] || {}).km || 0;
  const plannedKm = i => list ? list[i].km : 0;
  const maxKm = Math.max(1, ...Array.from({ length: 7 }, (_, i) => Math.max(dayKm(i), plannedKm(i))));
  const bars = Array.from({ length: 7 }, (_, i) => `<div class="col"><div class="stack">
      <div class="pbar" style="height:${plannedKm(i) / maxKm * 100}%" title="แผน ${r1(plannedKm(i))} km"></div>
      <div class="abar" style="height:${dayKm(i) / maxKm * 100}%" title="จริง ${r1(dayKm(i))} km"></div></div>
      <span>${dns(i)}</span></div>`).join("");
  const stat = (ic, v, l) => `<div class="stat"><div class="sic">${ic}</div><b>${v}</b><span>${l}</span></div>`;
  const next = weekAt(idx + 1);
  return `
    <section class="card summary"><div class="sum-head"><div>
      <span class="muted">ความคืบหน้าสัปดาห์นี้</span>
      <h2>${status}</h2>
      <p class="muted" style="margin:0">${wk ? `วิ่งแล้ว ${r1(act.km)} จาก ${r1(wk.km)} km` : "ยังไม่มีเป้าหมายสัปดาห์นี้"}</p>
    </div>${wk ? ring(pct, `${Math.round(pct)}%`, "ของแผน") : ""}</div></section>
    ${replanBanner()}
    <section class="card runcard"><div class="runtxt"><span class="muted">วันนี้</span><h3>ออกไปวิ่งกันเลย</h3><p class="muted" style="margin:0">${todaySess && todaySess.km ? `${todaySess.label} ${r1(todaySess.km)} km` : "วันนี้เป็นวันพัก ผ่อนคลายได้เลย"}</p><div class="actions" style="margin-top:10px"><button class="accent" data-tab="track">เริ่มวิ่งจับเส้นทาง</button></div></div><div class="runner" aria-hidden="true"><svg viewBox="0 0 320 130"><defs><linearGradient id="gl" x1="0" x2="1"><stop offset="0" stop-color="#8fdc52" stop-opacity="0"/><stop offset="1" stop-color="#8fdc52" stop-opacity=".9"/></linearGradient></defs><circle cx="250" cy="34" r="22" fill="#d8f8ac"/><path d="M14 116H306" stroke="var(--border)" stroke-width="3" stroke-linecap="round"/><path d="M30 92h44M22 102h30M46 80h26" stroke="url(#gl)" stroke-width="4" stroke-linecap="round"/><g stroke="var(--forest)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M150 66 L140 92 L166 100 L178 118"/><path d="M140 92 L116 104 L104 118"/><path d="M146 46 L138 66"/><path d="M148 50 L174 60 L190 48"/><path d="M145 50 L120 58 L108 48"/></g><circle cx="151" cy="30" r="11" fill="var(--forest)"/></svg></div></section>
    <section class="card"><div class="strip">${strip}</div></section>
    <div class="stats2">
      ${stat(IC.run, r1(act.km) + " km", "ระยะสัปดาห์นี้")}
      ${stat(IC.moon, act.sleepN ? r1(act.sleep) + " ชม." : "–", "นอนเฉลี่ย")}
      ${stat(IC.heart, act.hr ? act.hr + " bpm" : "–", "HR เฉลี่ย")}
      ${stat(IC.flame, act.kcal ? Math.round(act.kcal) + " kcal" : "–", "แคลอรี่รวม")}
    </div>
    <section class="card"><h3>วันนี้ตามแผน</h3>
      ${todaySess ? sessionCard(todaySess) : `<p class="muted">${plan() ? "วันนี้ไม่มีรายการในแผน" : "ไปที่แท็บแผนเพื่อสร้างแผนซ้อม"}</p>`}
      <div class="actions" style="justify-content:space-between">
        <span class="muted">${rec.km ? `บันทึกแล้ว ${r1(rec.km)} km` : "ยังไม่ได้บันทึกวันนี้"}</span>
        <button class="ghost" data-tab="log">${rec.km || rec.sleep ? "แก้ไข" : "บันทึกวันนี้"}</button>
      </div></section>
    <section class="card"><h3>ระยะรายวัน แผน กับ จริง</h3><div class="bars">${bars}</div></section>
    <section class="card"><h3>สัปดาห์หน้า</h3>${next
      ? `<p class="muted" style="margin:0">${next.phase} · ${r1(next.km)} km · วิ่งยาว ${next.long ? r1(next.long) + " km" : "–"}${next.race ? " · สัปดาห์แข่ง" : ""}</p>`
      : `<p class="muted" style="margin:0">${plan() ? "ไม่มีแผนสัปดาห์หน้า" : "ยังไม่มีแผน"}</p>`}</section>`;
};

VIEWS.log = () => {
  const d = state.ui.logDate || iso(new Date());
  const r = state.days[d] || {};
  const v = k => (r[k] !== undefined && r[k] !== 0 ? r[k] : "");
  const pace = r.km && r.min ? fmtPace(r.min / r.km) : "–";
  const weekDays = [];
  const mon = mondayOf(parseISO(d));
  for (let i = 0; i < 7; i++) { const k = iso(addDays(mon, i)); if (state.days[k]) weekDays.push(k); }
  return `
    <section class="card"><h3>บันทึกประจำวัน</h3>
      <div class="actions" style="margin:0 0 12px"><label class="btn ghost" for="rPhoto">📷 อ่านจากรูปแอปวิ่ง</label><input id="rPhoto" type="file" accept="image/*" hidden></div>
      <p id="photoMsg" class="muted" style="margin:0 0 8px"></p>
      <div class="field"><label for="lDate">วันที่</label><input type="date" id="lDate" value="${d}"></div>
      <h4>การนอน (คืนก่อนหน้า)</h4>
      <div class="grid2"><div class="field"><label for="lSleep">ชั่วโมงนอน</label><input id="lSleep" type="number" min="0" max="16" step="0.5" value="${v("sleep")}"></div></div>
      <h4>การวิ่ง (เว้นว่างถ้าไม่ได้วิ่ง)</h4>
      <div class="grid2">
        <div class="field"><label for="lKm">ระยะ (km)</label><input id="lKm" type="number" min="0" step="0.01" value="${v("km")}"></div>
        <div class="field"><label for="lMin">เวลา (นาที)</label><input id="lMin" type="number" min="0" step="0.1" value="${v("min")}"></div>
        <div class="field"><label for="lHr">HR เฉลี่ย (bpm)</label><input id="lHr" type="number" min="0" max="230" value="${v("hr")}"></div>
        <div class="field"><label for="lKcal">แคลอรี่ (kcal)</label><input id="lKcal" type="number" min="0" value="${v("kcal")}" placeholder="${Number(P().weight) && r.km ? Math.round(Number(P().weight) * r.km * 1.036) : ""}"></div>
        <div class="field"><label for="lRpe">ความเหนื่อย (1-10)</label><input id="lRpe" type="number" min="1" max="10" value="${v("rpe")}"></div>
        <div class="field"><label>เพซ (คำนวณอัตโนมัติ)</label><input id="lPace" value="${pace} /km" disabled></div>
      </div>
      <div class="field" style="margin-top:10px"><label for="lNote">บันทึกเพิ่มเติม</label><textarea id="lNote" rows="2">${esc(r.note || "")}</textarea></div>
      <div class="actions"><button data-act="saveDay">บันทึก</button><button class="ghost" data-act="clearLog">ล้างข้อมูล</button>${state.days[d] ? `<button class="del" data-act="delDay" data-date="${d}">ลบรายการวันนี้</button>` : ""}</div>
    </section>
    <section class="card"><h3>สัปดาห์นี้ (${shortDate(mon)} – ${shortDate(addDays(mon, 6))})</h3>
      ${weekDays.length ? `<ul class="daylist">${weekDays.map(k => { const x = state.days[k]; return `<li data-act="editDay" data-date="${k}"><span>${shortDate(parseISO(k))}</span><span class="muted">${x.sleep ? "นอน " + x.sleep + " ชม." : ""}${x.km ? " · วิ่ง " + r1(x.km) + " km" : ""}${x.hr ? " · HR " + x.hr : ""}</span></li>`; }).join("")}</ul>` : `<p class="muted">ยังไม่มีบันทึกในสัปดาห์นี้</p>`}
    </section>`;
};

VIEWS.plan = () => {
  if (!profileReady()) return `<section class="card gate"><div class="gate-ic">${IC.user}</div><h3>ใส่ข้อมูลนักวิ่งก่อน</h3>
    <p class="muted">ระบบต้องใช้อายุ วันที่ซ้อม และเวลาซ้อม เพื่อคำนวณโซนหัวใจ เพซ และปริมาณการซ้อมให้เหมาะกับคุณ</p>
    <p class="muted" style="margin:0">ยังขาด: <b>${profileMissing().join(", ")}</b></p>
    <div class="actions"><button data-tab="profile">ไปกรอกข้อมูลนักวิ่ง</button></div></section>`;
  const p = plan(), s = p ? p.setup : { distance: "10", raceDate: "", weeks: 12 };
  const opts = Object.keys(RACES).map(k => `<option value="${k}" ${String(s.distance) === k ? "selected" : ""}>${RACES[k].name}</option>`).join("");
  const form = `<section class="card"><h3>${p ? "ตั้งค่าแผนใหม่" : "สร้างแผนซ้อม"}</h3>
    <div class="grid2">
      <div class="field"><label for="pDist">เป้าหมายระยะ</label><select id="pDist">${opts}</select></div>
      <div class="field"><label for="pRace">วันแข่ง (ไม่บังคับ)</label><input type="date" id="pRace" value="${s.raceDate || ""}"></div>
      <div class="field"><label for="pWeeks">ระยะเวลาซ้อม (สัปดาห์)</label><input type="number" id="pWeeks" min="4" max="30" value="${s.weeks || 12}"></div>
    </div>
    <p class="muted" style="margin:8px 0 0">ถ้าใส่วันแข่ง ระบบจะคำนวณจำนวนสัปดาห์และวันแข่งให้เอง แผนจะเริ่มสัปดาห์นี้ และใช้ข้อมูลโปรไฟล์ประวัติการวิ่งตอนนี้</p>
    <div class="actions"><button data-act="genPlan">${p ? "สร้างแผนใหม่" : "สร้างแผน"}</button></div></section>`;
  if (!p) return form;

  const idx = planWeekIdx(), R = RACES[p.setup.distance];
  const warn = p.setup.distance !== "0" && p.W < R.minWeeks ? `<div class="warnbox">${p.W} สัปดาห์สั้นเกินไปสำหรับ ${R.name} (ขั้นต่ำ ${R.minWeeks} สัปดาห์)</div>` : "";
  const sig = p.sig !== profSig() ? `<div class="warnbox">โปรไฟล์เปลี่ยนไปหลังสร้างแผนนี้ แผนยังใช้ค่าเดิมอยู่ กด "สร้างแผนใหม่" เพื่ออัปเดต</div>` : "";
  const rows = p.weeks.map(w => {
    const act = weekActual(w.w), st = w.w < idx ? "เสร็จแล้ว" : w.w === idx ? "สัปดาห์นี้" : "ยังไม่ถึง";
    return `<tr${w.w === idx ? ' style="background:var(--soft)"' : ""}><td>${w.w}</td><td>${shortDate(weekStartOf(w.w))}</td><td>${w.phase}${w.cut ? " · ลดโหลด" : ""}</td>
      <td>${r1(w.km)}</td><td>${w.long ? r1(w.long) : "–"}</td><td>${w.w <= idx ? r1(act.km) : "–"}</td><td>${st}</td></tr>`;
  }).join("");
  const sel = state.ui.wk || idx || 1;
  const wk = weekAt(sel);
  const detail = wk ? `<div class="table-wrap"><table><thead><tr><th>วัน</th><th>ประเภท</th><th>ระยะ</th><th>เพซ</th><th>โซนหัวใจ</th></tr></thead><tbody>
    ${sessionsOf(wk).map((s, i) => { const date = addDays(weekStartOf(wk.w), i); return `<tr><td>${s.day}<br><span class="muted">${shortDate(date)}</span></td><td><span class="tag ${TAG[s.type]}">${s.label}</span></td><td>${s.km ? r1(s.km) + " km" : "–"}</td><td>${s.pace ? s.pace : "–"}</td><td>${s.hr ? (zoneBpm(s.hr) ? s.hr + " · " + zoneBpm(s.hr) : s.hr) : "–"}</td></tr>`; }).join("")}
    </tbody></table></div>` : "";
  return `${warn}${sig}
    <section class="card"><h3>${R.name} · ${p.W} สัปดาห์</h3>
      <div class="kpis">
        <div class="kpi"><span>เริ่มแผน</span><b>${shortDate(parseISO(p.startMonday))}</b></div>
        <div class="kpi"><span>ระยะเริ่มต้น → สูงสุด</span><b>${r1(p.startKm)} → ${r1(p.peak)} km</b></div>
        <div class="kpi"><span>เพิ่มสูงสุดต่อสัปดาห์</span><b>${Math.round(p.rate * 100)}%</b></div>
        <div class="kpi"><span>วิ่งยาวสูงสุดตามเวลาซ้อม</span><b>${r1(p.longCap)} km</b></div>
      </div>
      <p class="muted" style="margin:10px 0 0">เพซที่ใช้ในแผน: ง่าย ${fmtPace(p.paces.easy)} · วิ่งยาว ${fmtPace(p.paces.long)} · Tempo ${fmtPace(p.paces.tempo)} · อินเทอร์วัล ${fmtPace(p.paces.interval)} /km (${esc(p.paces.src)})</p>
      ${p.setup.raceDate && p.setup.distance !== "0" ? `<p class="muted" style="margin:6px 0 0">วันแข่ง ${p.setup.raceDate}</p>` : ""}
    </section>
    <section class="card"><h3>ภาพรวมทั้งแผน</h3>
      <div class="table-wrap"><table><thead><tr><th>สัปดาห์</th><th>เริ่ม</th><th>ช่วง</th><th>แผน km</th><th>วิ่งยาว</th><th>จริง km</th><th>สถานะ</th></tr></thead><tbody>${rows}</tbody></table></div>
    </section>
    <section class="card"><h3>รายละเอียดรายวัน</h3>
      <div class="field"><label for="wkSel">สัปดาห์</label><select id="wkSel">${p.weeks.map(w => `<option value="${w.w}" ${w.w === sel ? "selected" : ""}>สัปดาห์ ${w.w} (${w.phase})</option>`).join("")}</select></div>
      <div style="margin-top:10px">${detail}</div>
    </section>
    ${form}
    <section class="card"><h3>เตือนในปฏิทิน</h3>
      <p class="muted" style="margin:0 0 10px">สร้างไฟล์ปฏิทิน (.ics) ของตารางซ้อมตั้งแต่วันนี้เป็นต้นไป แล้วเพิ่มลงปฏิทินของ iPhone ให้เตือนแม้ไม่ได้เปิดแอป</p>
      <div class="grid2"><div class="field"><label for="icsT">เวลาซ้อม</label><select id="icsT">${icsOpts(["05:00","05:30","06:00","06:30","07:00","17:00","17:30","18:00","19:00"], icsPref().t, v => v)}</select></div>
      <div class="field"><label for="icsA">เตือนล่วงหน้า</label><select id="icsA">${icsOpts(["0","15","30","60"], icsPref().a, v => v === "0" ? "ตอนเริ่ม" : v === "60" ? "1 ชั่วโมง" : v + " นาที")}</select></div></div>
      <div class="actions"><button data-act="exportIcs">เพิ่มตารางซ้อมลงปฏิทิน</button></div>
      <p class="muted" style="margin:10px 0 0;font-size:.78rem">กดแล้วเลือก "เพิ่มลงปฏิทิน" ถ้านำเข้าซ้ำ รายการวันเดิมจะถูกอัปเดต ไม่ซ้ำกัน แต่ถ้าสร้างแผนใหม่ ให้ลบรายการเก่าที่ไม่ใช้แล้วในปฏิทินเอง</p>
    </section>
    <section class="card"><div class="actions" style="margin:0"><button class="ghost" data-act="replan">สร้างแผนใหม่จากข้อมูลล่าสุด (คงวันแข่งเดิม)</button></div></section>`;
};

VIEWS.summary = () => {
  const idx = planWeekIdx(), t = new Date();
  const mon = thisMon(), rows = [], data = [];
  for (let k = 7; k >= 0; k--) {
    const m = addDays(mon, -7 * k), i = weekIndexOf(m), w = weekAt(i), a = rangeStats(m, addDays(m, 7));
    data.push({ m, w, a });
  }
  // กราฟ แผน vs จริง
  const W = 600, H = 220, pl = 36, pb = 28, pt = 16;
  const max = Math.max(1, ...data.map(d => Math.max(d.w ? d.w.km : 0, d.a.km)));
  const bw = (W - pl) / data.length, y = v => pt + (H - pt - pb) * (1 - v / (max * 1.1));
  const chart = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="แผนเทียบกับจริง">${data.map((d, i) => {
    const x = pl + i * bw + bw * 0.12, bwid = bw * 0.36;
    const py = d.w ? y(d.w.km) : H - pb, ay = y(d.a.km);
    return `<rect x="${x}" y="${py}" width="${bwid}" height="${Math.max(0, H - pb - py)}" rx="3" fill="var(--border)"><title>แผน ${d.w ? r1(d.w.km) : "–"} km</title></rect>
      <rect x="${x + bwid + 2}" y="${ay}" width="${bwid}" height="${Math.max(0, H - pb - ay)}" rx="3" fill="${i === data.length - 1 ? "var(--accent)" : "var(--ok)"}"><title>จริง ${r1(d.a.km)} km</title></rect>
      <text x="${x + bwid}" y="${H - 8}" font-size="10" text-anchor="middle" fill="var(--muted)">${shortDate(d.m)}</text>`;
  }).join("")}</svg>`;

  data.forEach(d => {
    const pct = d.w && d.w.km ? Math.round(d.a.km / d.w.km * 100) : null;
    rows.push(`<tr><td>${d.w ? "สัปดาห์ " + d.w.w : "–"}<br><span class="muted">${shortDate(d.m)}</span></td>
      <td>${d.w ? r1(d.w.km) : "–"}</td><td>${r1(d.a.km)}</td><td>${pct !== null && weekIndexOf(d.m) <= idx ? pct + "%" : "–"}</td>
      <td>${d.a.runs}${d.w ? " / " + sessionsOf(d.w).filter(s => s.km > 0).length : ""}</td><td>${fmtPace(d.a.pace)}</td>
      <td>${d.a.kcal ? Math.round(d.a.kcal) : "–"}</td><td>${d.a.hr || "–"}</td><td>${d.a.sleepN ? r1(d.a.sleep) : "–"}</td><td>${d.a.rpe ? r1(d.a.rpe) : "–"}</td></tr>`);
  });

  // วิเคราะห์สัปดาห์ที่แล้ว
  const lastI = idx - 1, lw = weekAt(lastI), la = lastI >= 1 ? weekActual(lastI) : null;
  let insights = `<p class="muted">ยังไม่มีสัปดาห์ที่จบให้วิเคราะห์</p>`;
  if (la) {
    const items = [];
    if (lw && lw.km) {
      const c = la.km / lw.km;
      items.push({ l: c < 0.7 ? "bad" : c > 1.2 ? "warn" : "", t: `ทำได้ ${Math.round(c * 100)}% ของแผน (${r1(la.km)} / ${r1(lw.km)} km)`, x: c < 0.7 ? "ลดเป้าหรือหาวันซ้อมที่ยืดหยุ่นขึ้น" : c > 1.2 ? "เกินแผนมาก ระวังการบาดเจ็บ" : "ทำตามแผนได้ดี" });
    }
    if (la.sleepN) items.push({ l: la.sleep < 6 ? "bad" : la.sleep < 7 ? "warn" : "", t: `นอนเฉลี่ย ${r1(la.sleep)} ชม.`, x: la.sleep < 6 ? "นอนน้อยเกินไป ฟื้นตัวช้า" : la.sleep < 7 ? "ควรนอนเพิ่มเป็น 7 ชม. ขึ้นไป" : "การนอนเพียงพอ" });

// ลดจำนวนจุด (Douglas-Peucker) ก่อนบันทึก ให้ข้อมูลเล็กลง

  return pts.filter((_, i) => keep[i]);
}

const TILE_CACHE = "garuda-tiles-v1", TILE_URL = (z, x, y) => `https://tile.openstreetmap.org/${z}/${x}/${y}.png`;
const OFF_KEY = "garuda-offline-regions", OFF_MAX = 3000;

const tileXY = (lat, lng, z) => { const n = 2 ** z, la = lat * Math.PI / 180; return [Math.floor((lng + 180) / 360 * n), Math.floor((1 - Math.log(Math.tan(la) + 1 / Math.cos(la)) / Math.PI) / 2 * n)]; };

function offTiles(lat, lng, rKm, z0, z1) {
  const out = [], kl = 111.32 * Math.cos(lat * Math.PI / 180), dLat = rKm / 111.32, dLng = rKm / kl;

    for (let x = Math.max(0, x0); x <= Math.min(n - 1, x1); x++) for (let y = Math.max(0, y0); y <= Math.min(n - 1, y1); y++) {

const CachedTiles = L.TileLayer.extend({
  createTile(coords, done) {
    const img = document.createElement("img"); img.alt = "";
    const url = this.getTileUrl(coords), fin = () => done(null, img);

// ---------- ส่งตารางซ้อมเข้าปฏิทิน (.ics) ----------
const ICS_KEY = "garuda-ics";
const icsPref = () => { try { return { t: "06:00", a: "30", ...JSON.parse(localStorage.getItem(ICS_KEY)) }; } catch (e) { return { t: "06:00", a: "30" }; } };
const icsOpts = (vals, sel, lab) => vals.map(v => `<option value="${v}"${v === sel ? " selected" : ""}>${lab(v)}</option>`).join("");
const icsEsc = t => String(t).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
function icsFold(line) {
  const enc = new TextEncoder(); if (enc.encode(line).length <= 74) return line;
  const out = []; let cur = "", n = 0;
  for (const ch of line) { const b = enc.encode(ch).length; if (n + b > (out.length ? 73 : 74)) { out.push(cur); cur = ""; n = 0; } cur += ch; n += b; }
  out.push(cur); return out.join("\r\n ");
}
const icsStamp = (d, hh, mm) => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(hh)}${pad(mm)}00`;
function buildIcs(timeStr, alarmMin) {
  const [hh, mm] = timeStr.split(":").map(Number), p = plan(), today = new Date(); today.setHours(0, 0, 0, 0);
  const now = new Date(), st = `${now.getUTCFullYear()}${pad(now.getUTCMonth() + 1)}${pad(now.getUTCDate())}T${pad(now.getUTCHours())}${pad(now.getUTCMinutes())}${pad(now.getUTCSeconds())}Z`;
  const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//StrivUp//TH", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", "X-WR-CALNAME:StrivUp"];
  let n = 0;
  p.weeks.forEach(wk => {
    sessionsOf(wk).forEach((x, i) => {
      if (!(x.km > 0)) return;
      const date = addDays(weekStartOf(wk.w), i); if (date < today) return;
      const pace = parsePace(x.pace), dur = Math.max(20, Math.min(420, Math.round(x.km * (pace || 6.5))));
      const end = new Date(date.getFullYear(), date.getMonth(), date.getDate(), hh, mm + dur);
      const desc = [`สัปดาห์ที่ ${wk.w}/${p.W} · ${wk.phase}`, `ระยะ ${r1(x.km)} km`, x.pace ? `เพซ ${x.pace} /km` : "", x.hr ? `โซนหัวใจ ${x.hr}${zoneBpm(x.hr) ? " (" + zoneBpm(x.hr) + ")" : ""}` : ""].filter(Boolean).join("\n");
      L.push("BEGIN:VEVENT", `UID:strivup-run-${iso(date)}@strivup`, `DTSTAMP:${st}`,
        `DTSTART:${icsStamp(date, hh, mm)}`, `DTEND:${icsStamp(end, end.getHours(), end.getMinutes()).replace(/^\d{8}/, `${end.getFullYear()}${pad(end.getMonth() + 1)}${pad(end.getDate())}`)}`,
        `SUMMARY:${icsEsc("🏃 " + x.label + " " + r1(x.km) + " km")}`, `DESCRIPTION:${icsEsc(desc)}`,
        "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${icsEsc("ถึงเวลาซ้อม: " + x.label + " " + r1(x.km) + " km")}`, `TRIGGER:-PT${alarmMin}M`, "END:VALARM", "END:VEVENT");
      n++;
    });
  });
  L.push("END:VCALENDAR");
  return { text: L.map(icsFold).join("\r\n") + "\r\n", n };
}
const exportIcsFn = async () => {
  if (!plan()) { alert("ยังไม่มีแผนซ้อม"); return; }
  const t = document.getElementById("icsT").value, a = document.getElementById("icsA").value;
  try { localStorage.setItem(ICS_KEY, JSON.stringify({ t, a })); } catch (e) {}
  const { text, n } = buildIcs(t, Number(a));
  if (!n) { alert("ไม่มีวันซ้อมที่เหลือในแผน"); return; }
  const blob = new Blob([text], { type: "text/calendar;charset=utf-8" }), file = new File([blob], "strivup-plan.ics", { type: "text/calendar" });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "ตารางซ้อม StrivUp" }); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  const url = URL.createObjectURL(blob), el = document.createElement("a");
  el.href = url; el.download = "strivup-plan.ics"; document.body.appendChild(el); el.click(); el.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  alert("สร้างปฏิทิน " + n + " รายการแล้ว ถ้าไม่มีหน้าต่างเพิ่มลงปฏิทินขึ้นมา ให้เปิดไฟล์ strivup-plan.ics ที่ดาวน์โหลดไว้");

function wmParseTime(t) {            // "58:59" | "1:05:30" | "45" (นาที) -> วินาที

  return Math.round(p[0] * 3600 + p[1] * 60 + p[2]);
}
function wmFmtTime(sec) {

}

  return m + ":" + String(s).padStart(2, "0");
}

function wmLoadFile(f) {

function wmBlob() { return new Promise(res => document.getElementById("wmCv").toBlob(res, "image/jpeg", 0.92)); }
function wmName() { return "strivup-" + (WM.v.date || iso(new Date())) + ".jpg"; }
ACT.wmFill = () => {
  const r = wmLatest();
  if (!r) { alert("ไม่มีข้อมูลการวิ่งให้ดึง"); return; }
  const sec = Math.round((Number(r.min) || 0) * 60);
  const set = (id, val) => { const e = document.getElementById(id); if (e) e.value = val; };
  set("wmKm", r.km ? String(Math.round(r.km * 100) / 100) : ""); set("wmTime", sec ? wmFmtTime(sec) : ""); set("wmKcal", r.kcal ? Math.round(r.kcal) : ""); set("wmDate", r.date || "");

};
ACT.wmSave = async () => {
  if (!WM.img) return;
  const b = await wmBlob(); if (!b) return;
  const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = wmName();
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
};
ACT.wmShare = async () => {
  if (!WM.img) return;
  const b = await wmBlob(); if (!b) return;
  const file = new File([b], wmName(), { type: "image/jpeg" });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "StrivUp" }); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
